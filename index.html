<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>DECOLAB — ديكور منزلي</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="./styles.css">
</head>


<body class="lang-ar">

<div class="wrap">

  <header>

    <img src="./IMAGES/logo.png" alt="DECOLAB" class="logo">

    <h1 id="site-title">DECOLAB</h1>
    <p id="site-sub">ديكور منزلي • التصميم العصري</p>

    <div class="controls">
      <input id="searchInput" placeholder="ابحث عن منتج...">

      <div class="lang-toggle">
        <button id="btn-ar">العربية</button>
        <button id="btn-fr">Français</button>
      </div>

      <button id="adminToggle" class="btn small">⚙️</button>
    </div>
  </header>

  <main>
    <section id="productsGrid" class="grid"></section>
  </main>

  <footer>
    <div id="footer-text">اتصل/واتساب: 0691010969 — DECOLAB</div>
  </footer>

</div>

<!-- زر العودة للأعلى -->
<button id="backToTop">↑</button>

<!-- JS -->
<script src="./app.js" defer></script>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden admin-panel">

  <h2>إضافة منتج</h2>

  <input type="text" id="nameAr" placeholder="اسم المنتج بالعربية">

  <input type="text" id="nameFr" placeholder="Nom du produit en français">

  <input type="text" id="price" placeholder="السعر">

  <input type="text" id="image" placeholder="رابط الصورة أو ./IMAGES/image.jpg">

  <button id="addProductBtn">
    إضافة المنتج
  </button>

</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="hidden login-modal">

  <div class="login-box">

    <h3>دخول الأدمن</h3>

    <input type="password"
           id="adminPassword"
           placeholder="كلمة المرور">

    <button id="loginBtn">
      دخول
    </button>

    <p id="loginError"></p>

  </div>

</div>
</body>
</html>
